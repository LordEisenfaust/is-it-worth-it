name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the version check can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Version erhöht?
        # Dependency updates from Dependabot change no app code of ours, so they need no new version.
        if: github.actor != 'dependabot[bot]'
        run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Browser für die Oberflächen-Tests installieren
        run: npx playwright install --with-deps chromium
      - name: Oberflächen-Tests (Playwright, Desktop und Handy)
        run: npm run test:e2e
