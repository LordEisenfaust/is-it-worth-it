<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f26b1d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lohnt es? – Der Rechner, den dein Warenkorb hasst</title>
    <script>
      // Apply a saved manual theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = JSON.parse(localStorage.getItem("iiwi:theme"));
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
